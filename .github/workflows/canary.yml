name: Daily live check

# Proves Class Act still works against the real Anthropic API.
#
# The test suite proves the code is correct but never touches the network, so
# it cannot see a revoked key, a retired model, an empty account, or an
# Anthropic outage. This can. The app was dead for four months and nothing
# noticed; this is what would have noticed.
#
# GitHub emails the repository owner when a scheduled workflow fails, so a
# failure here lands in your inbox without any further setup.

on:
  schedule:
    # Twice daily, at odd minutes, on purpose.
    #
    # GitHub's scheduler is best effort, not a guarantee: runs queued on the
    # hour compete with everyone else's and are routinely delayed or dropped
    # entirely. The first version of this file asked for 07:00 and simply never
    # ran. Odd minutes are far less contended, and two slots mean one missed
    # window does not cost a whole day of cover.
    - cron: "23 7 * * *"
    - cron: "23 15 * * *"
  # Also run whenever the app changes, so a broken deploy is caught at once
  # rather than waiting for the next slot.
  push:
    branches: [main]
    paths:
      - "llm/**"
      - "generators/**"
      - "curriculum/**"
      - "app.py"
      - "requirements.txt"
      - "scripts/canary.py"
  workflow_dispatch: # lets you run it on demand from the Actions tab

# One run at a time; a slow run should not overlap the next day's.
concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  live-check:
    name: Generate a real worksheet
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Call Claude and build a worksheet
        env:
          # Set under Settings > Secrets and variables > Actions.
          # If absent the script exits 0 with a note, so forks and
          # contributors do not see spurious failures.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/canary.py
